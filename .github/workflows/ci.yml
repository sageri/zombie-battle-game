# エンジン門禁（node verify/engine.test.mjs）を push / PR で機械実行する。
# 「門禁が緑ならマージ」を agent の申告ではなく GitHub 上の事実にする。
# ブラウザ E2E（browser-drive.mjs）は本機の Edge + GUI に依存するため含めない。
name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node verify/engine.test.mjs
